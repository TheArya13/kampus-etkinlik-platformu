<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Profilim</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h2>👤 Profilim</h2>
    <div class="card p-4">
        <p><strong>Kullanıcı adı:</strong> {{ profil.kullanici.username }}</p>
        <p><strong>E-posta:</strong> {{ profil.kullanici.email }}</p>
        <p><strong>Rol:</strong> {{ profil.get_rol_display }}</p>
        <p><strong>Bio:</strong> {{ profil.bio|default:"Henüz bio eklenmemiş." }}</p>
    </div>
</div>
</body>
</html>
