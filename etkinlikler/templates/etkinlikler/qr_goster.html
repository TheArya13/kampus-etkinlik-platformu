<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>QR Kodunuz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5 text-center">
    <h2>🎟️ Kayıt QR Kodunuz</h2>
    <h4 class="text-muted">{{ etkinlik.baslik }}</h4>
    <hr>
    <img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Kod" class="img-fluid" style="max-width: 300px;">
    <p class="mt-3">Bu QR kodu etkinlik girişinde okutunuz.</p>
    <a href="{% url 'etkinlik_detay' etkinlik.pk %}" class="btn btn-primary mt-2">← Geri Dön</a>
</div>
</body>
</html>
